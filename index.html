function levelQuestion(){
 const level=DANS[st.levelId],i=st.levelIndex,q=level.questions[i],key=lvkey(st.levelId,i),sel=st.levelAnswers[key],rev=!!st.levelRevealed[key],ord=order(st.levelId+21,i),calc=!!q[4];

 ${st.levelId===12&&completed===0?`<div class="shock-banner">⚠️ 初回から容赦なし！ 十段の超難問に挑戦中。<br>難しかったら「メイン画面へ」で初級から選べます！</div>`:''}
 <div class="question-card"><div class="question-top row"><span class="q-num">${esc(level.title)} · QUESTION ${String(i+1).padStart(2,'0')} / 10</span><span class="pill">${calc?'🧮 計算問題':'🔬 専門知識'}</span></div>${miniCar(st.levelId===12?'boss':'tech')}<h2>${esc(q[0])}</h2><div class="q-tools">${calc?'<button data-action="calc">🧮 電卓を開く</button>':''}<button data-action="levelBookmark">${st.bookmarks['L'+key]?'★ 保存済み':'☆ あとで復習'}</button></div>

function levelResult(){const id=st.levelId,g=DANS[id],score=g.questions.reduce((n,q,i)=>n+(st.levelAnswers[lvkey(id,i)]===q[2]?1:0),0);return `<div class="eyebrow">${esc(g.title)} · COURSE RESULTS</div><div class="result mt"><div class="confetti">${id===12?'🏆 🔥 🏎️':'🏁 ⭐ 🏁'}</div><h2>${esc(g.title)} ミッション完了</h2><div class="big">${score}<span style="font-size:22px"> / 10</span></div><p>${score===10?'パーフェクト！ 全問正解です！':score>=8?'すばらしい！ かなりの知識です！':'知らなかった技術を覚えれば、次はもっと強くなれます！'}</p></div><div class="panel mt"><h2>今回の10問</h2>${g.questions.map((q,i)=>`<div class="scoreline"><span>${st.levelAnswers[lvkey(id,i)]===q[2]?'✅':'❌'} 第${i+1}問　${esc(q[0]).slice(0,26)}…</span><span>${st.levelAnswers[lvkey(id,i)]===q[2]?'正解':'復習'}</span></div>`).join('')}</div><button class="btn primary full" data-action="backHome">⌂ メイン画面で他の難易度を選ぶ</button><button class="btn secondary full mt" data-action="levelReplay">この難易度をもう一度</button>`}
function actLevel(a,d){
 if(a==='marathonHome'){view='marathonHome';render();scrollUp();return true}
 if(a==='levelOpen'){st.levelId=Number(d.level);st.levelIndex=DANS[st.levelId].questions.findIndex((q,i)=>!st.levelRevealed[lvkey(st.levelId,i)]);if(st.levelIndex===-1){view='levelResult';st.levelIndex=9}else view='levelQuestion';save();render();scrollUp();return true}
 if(a==='levelSelect'){st.levelAnswers[lvkey(st.levelId,st.levelIndex)]=Number(d.opt);save();render();return true}
 if(a==='levelConfirm'){const k=lvkey(st.levelId,st.levelIndex);if(st.levelAnswers[k]===undefined||st.levelRevealed[k])return true;st.levelRevealed[k]=true;const correct=st.levelAnswers[k]===DANS[st.levelId].questions[st.levelIndex][2];if(correct)st.xp+=10;else st.xp+=2;sound(correct);save();render();return true}
 if(a==='levelNext'){if(st.levelIndex<9){st.levelIndex++;view='levelQuestion'}else{let v=DANS[st.levelId].questions.reduce((n,q,i)=>n+(st.levelAnswers[lvkey(st.levelId,i)]===q[2]?1:0),0);st.levelCleared[st.levelId]=Math.max(st.levelCleared[st.levelId]||0,v);view='levelResult'}save();render();scrollUp();return true}
 if(a==='levelReplay'){for(let i=0;i<10;i++){delete st.levelAnswers[lvkey(st.levelId,i)];delete st.levelRevealed[lvkey(st.levelId,i)]}st.levelIndex=0;view='levelQuestion';save();render();scrollUp();return true}
 if(a==='levelBookmark'){const k='L'+lvkey(st.levelId,st.levelIndex);st.bookmarks[k]=!st.bookmarks[k];save();render();toast(st.bookmarks[k]?'★ 保存しました':'保存を解除');return true}
 return false;
}
function home(){const mx=ST.findIndex((g,i)=>!st.graded[i]);const recommended=mx<0?9:mx;return `<div class="hero hero-split"><div class="hero-content"><div class="eyebrow">🏁 100 QUESTIONS · 10 STAGES</div><h1>自動車博士<br><span>ULTIMATE 100</span></h1><p>歴史、幻の技術、精密部品、塗装、空力、EV、故障解析。<strong>知らない世界が広がる</strong>自動車の究極クイズゲーム。</p><div class="hero-chip-row"><span class="hero-chip">ENGINEERING</span><span class="hero-chip">RACING</span><span class="hero-chip">HISTORY</span></div><div class="stats"><div class="stat"><b>${solved()}<small>/100</small></b><span>回答済み</span></div><div class="stat"><b>${st.xp}</b><span>総獲得XP</span></div><div class="stat"><b>${st.bestStreak}</b><span>最高連続正解</span></div></div><button class="btn primary full" data-action="play" data-stage="${recommended}">${finished()?'結果と認定証を見る 🏆':solved()?'続きからプレイ ▶':'挑戦を開始する ▶'}</button></div>${heroCar('home')}</div><div class="row mt"><h2 class="section-title">STAGE SELECT</h2><span class="muted small">クリアで次のステージ解放</span></div><div class="stage-grid">${ST.map((g,s)=>`<button class="stage ${s===recommended?'active':''}" data-action="openStage" data-stage="${s}" ${unlocked(s)?'':'disabled'}><span class="n">STAGE ${String(s+1).padStart(2,'0')}</span><span class="star">${st.graded[s]?'★':unlocked(s)?'◇':'🔒'}</span><strong>${esc(g.title)}</strong><span class="state">${st.graded[s]?`${scored(s)} / 10 正解`:`${g.questions.filter((q,i)=>st.a[qa(s,i)]!==undefined).length}/10 回答`}</span></button>`).join('')}</div><div class="panel mt"><div class="row"><h2>🎖️ 階級と特典</h2><span class="pill gold">90点以上で認定</span></div><div class="ranking">${[['初心者',0],['整備士見習い',10],['技術探究者',40],['自動車博士',70],['グランドマスター',90]].map(([label,req])=>`<span class="medal ${total()>=req?'on':''}">${req===90?'🏆':'✦'} ${label}</span>`).join('')}</div><p>各ステージは10問。正解でXP獲得、連続正解でコンボ加算。ヒントと50:50は回数限定。採点後は解説図鑑として復習できます。</p><button class="btn secondary full" data-action="review">📖 復習・解説図鑑を開く</button></div><button class="btn ghost full" data-action="resetAsk">進捗データをリセット function progressMini(){const sec=st.stage;const answered=ST[sec].questions.filter((q,i)=>st.a[qa(sec,i)]!==undefined).length;return `<div class="row mb"><div><div class="eyebrow">STAGE ${String(sec+1).padStart(2,'0')} / 10 · ${esc(ST[sec].tag)}</div><div class="small muted">${esc(ST[sec].title)}</div></div><span class="pill gold">⚡ ${st.xp} XP</span></div><div class="progress mb"><div style="width:${(sec*10+answered)}%"></div></div><div class="row mb"><span class="small muted">全体 ${solved()} / 100</span><span class="small">🔥 ${st.streak} COMBO · ⏱ <span id="elapsed">--:--</span></span></div>`}
function question(){if(st.graded[st.stage]){view='stageResult';return stageResult()}const q=qData(),key=qa(st.stage,st.i),sel=st.a[key],rev=!!st.revealed[key],ord=order(st.stage,st.i),hidden=st.hidden[key]||[],calc=!!q[4],correct=sel===q[2];return `${progressMini()}<div class="question-card"><div class="row"><span class="q-num">QUESTION ${String(st.stage*10+st.i+1).padStart(3,'0')}</span><span class="pill">${calc?'🧮 計算問題':'🔬 技術・知識'}</span></div><h2>${esc(q[0])}</h2>${!rev?`<div class="q-tools">${calc?'<button data-action="calc">🧮 電卓を開く</button>':''}<button data-action="fifty" ${st.fifty<=0||hidden.length?'disabled':''}>◐ 50:50 ×${st.fifty}</button><button data-action="hint" ${st.hints<=0?'disabled':''}>💡 ヒント ×${st.hints}</button><button data-action="bookmark">${st.bookmarks[key]?'★ 保存済み':'☆ あとで復習'}</button></div>`:''}${ord.map((opt,j)=>`<button class="choice ${hidden.includes(opt)?'eliminated':''} ${rev&&opt===q[2]?'correct':''} ${rev&&opt===sel&&sel!==q[2]?'incorrect':''} ${!rev&&sel===opt?'selected':''}" data-action="select" data-opt="${opt}" ${rev||hidden.includes(opt)?'disabled':''}><span class="letter">${String.fromCharCode(65+j)}</span><span>${esc(q[1][opt])}</span></button>`).join('')}${rev?`<div class="answer-panel ${correct?'good':'bad'} mt"><h3>${correct?'✅ 正解！':'❌ 不正解'}</h3><div><b>正解：${esc(q[1][q[2]])}</b></div><p>${esc(q[3])}</p><p style="color:var(--gold)">${correct?`+${10+Math.min(15,(st.streak-1)*3)} XP 獲得`: '解説を読んで知識をGET！'}</p></div>`:''}<div class="action-bar">${rev?`<button class="btn primary full" data-action="next">${st.i===9?'ステージ結果を見る 🏁':'次の問題へ →'}</button>`:`<button class="btn secondary" data-action="backHome">⌂ 戻る</button><button class="btn primary" data-action="confirm" ${sel===undefined?'disabled':''}>回答を確定 ✓</button>`}</div></div><p class="footnote mt">${calc?'💡 実際の車の部品に関連する計算です。電卓の計算結果はそのままコピーできます。':'💡 50:50では不正解の選択肢を2つ消去。ヒントは正解を直接表示しません。'}</p>`}
function stageResult(){const s=st.stage,v=scored(s);return `<div class="eyebrow">STAGE ${s+1} CLEARED</div><div class="result mt"><div class="confetti">${v>=9?'🏆 ✨ 🏆':v>=6?'🏁 ⭐ 🏁':'🔧 📚 🔧'}</div><h2>${esc(ST[s].title)}</h2><div class="big">${v}<span style="font-size:22px"> / 10</span></div><p>${v===10?'PERFECT！圧巻の全問正解！':v>=8?'すばらしい！次のステージへ進もう。':'新しい知識を獲得しました！'}</p><p class="muted small">現在の総合成績 ${total()} / 100点 · 累計 ${st.xp} XP</p></div><div class="panel mt"><h2>今回の解答結果</h2>${ST[s].questions.map((q,i)=>`<div class="scoreline"><span style="max-width:85%">${st.a[qa(s,i)]===q[2]?'✅':'❌'} ${i+1}. ${esc(q[0]).slice(0,34)}…</span><span>${st.a[qa(s,i)]===q[2]?'正解':'復習'}</span></div>`).join('')}<button class="btn secondary full mt" data-action="reviewStage">📖 解説をすべて確認する</button></div>${s<9?`<button class="btn primary full" data-action="advance">次のステージへ ▶</button>`:`<button class="btn primary full" data-action="finish">総合成績を見る 🏆</button>`}<button class="btn ghost full mt" data-action="backHome">ステージ一覧へ戻る</button>`}
function final(){return `<div class="eyebrow">FINAL RESULTS</div><div class="result mt"><div class="confetti">🏆 ✨ 🏎️ ✨ 🏆</div><h2>ULTIMATE 100</h2><div class="big">${total()}<span style="font-size:22px"> / 100</span></div><h2>${total()>=90?'グランドマスター認定！':'究極100問 挑戦完了！'}</h2><p>${total()>=90?'90点以上を達成！架空の最高称号を獲得しました。':'100問を通じて新しい自動車知識を発見しました！'}</p><div class="row" style="justify-content:center"><span class="pill">🔥 最高 ${st.bestStreak} 連続正解</span><span class="pill gold">⚡ ${st.xp} XP</span></div></div><div class="panel mt"><h2>ステージ別成績</h2>${ST.map((g,s)=>`<div class="bar-row"><span>S${s+1} ${esc(g.tag)}</span><div class="progress"><div style="width:${scored(s)*10}%"></div></div><b>${scored(s)}/10</b></div>`).join('')}</div><div class="panel"><h2>🏅 オリジナル認定証</h2><p>氏名を入力すると、成績入りの認定証画像を作成できます。架空ゲームの記念証です。</p><label for="certName" class="small muted">認定証に表示する名前</label><input id="certName" class="field mt" maxlength="28" placeholder="例：CAR MASTER"><button class="btn primary full mt" data-action="certificate">認定証を表示・画像保存</button></div><button class="btn secondary full" data-action="review">📖 100問の解説・復習</button><button class="btn ghost full mt" data-action="backHome">ステージ一覧へ</button>`}
function review(){const items=[];ST.forEach((g,s)=>g.questions.forEach((q,i)=>{if(st.a[qa(s,i)]!==undefined)items.push({s,i,q,wrong:st.a[qa(s,i)]!==q[2],bookmarked:!!st.bookmarks[qa(s,i)]})}));const wrong=items.filter(x=>x.wrong),star=items.filter(x=>x.bookmarked);return `<div class="eyebrow">KNOWLEDGE GARAGE</div><h1>📖 解説図鑑</h1><p class="muted small">解答済みの問題について、正解と技術解説をまとめて復習できます。</p><div class="stats"><div class="stat"><b>${items.length}</b><span>解答済み</span></div><div class="stat"><b>${wrong.length}</b><span>不正解</span></div><div class="stat"><b>${star.length}</b><span>保存問題</span></div></div><div class="row wrap mb"><button class="btn secondary tiny" data-action="filter" data-filter="all">すべて</button><button class="btn secondary tiny" data-action="filter" data-filter="wrong">不正解</button><button class="btn secondary tiny" data-action="filter" data-filter="star">★ 保存</button></div><div id="reviewItems">${reviewItems(items)}</div><button class="btn ghost full mt" data-action="backHome">戻る</button>`}
function reviewItems(items){return items.length?items.map(({s,i,q,wrong})=>`<div class="panel"><div class="row"><span class="eyebrow">STAGE ${s+1} · Q${s*10+i+1}</span><span>${wrong?'❌':'✅'}</span></div><h2>${esc(q[0])}</h2><p><b style="color:var(--good)">正解：${esc(q[1][q[2]])}</b></p><p>${esc(q[3])}</p></div>`).join(''):'<div class="panel"><p>表示できる問題がありません。</p></div>'}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action,b.dataset)));}
function act(a,d={}){if(actLevel(a,d))return;if(a==='backHome'){view='home';render();scrollUp()}else if(a==='play'){if(finished()){view='final'}else{st.stage=Number(d.stage);st.i=firstUnanswered(st.stage);view='question'}save();render();scrollUp()}else if(a==='openStage'){const s=Number(d.stage);if(!unlocked(s))return;st.stage=s;st.i=firstUnanswered(s);view=st.graded[s]?'stageResult':'question';save();render();scrollUp()}else if(a==='select'){st.a[qa(st.stage,st.i)]=Number(d.opt);save();render()}else if(a==='confirm'){const k=qa(st.stage,st.i);if(st.a[k]===undefined||st.revealed[k])return;st.revealed[k]=true;const right=st.a[k]===qData()[2];st.streak=right?st.streak+1:0;st.bestStreak=Math.max(st.bestStreak,st.streak);if(right)st.xp+=10+Math.min(15,(st.streak-1)*3);else st.xp+=2;sound(right);save();render();if(right&&st.streak>1)toast(`🔥 ${st.streak}連続正解！ COMBO!`)}else if(a==='next'){if(st.i<9){st.i++;view='question'}else{st.graded[st.stage]=true;view='stageResult';sound(true)}save();render();scrollUp()}else if(a==='advance'){st.stage=Math.min(9,st.stage+1);st.i=firstUnanswered(st.stage);view='question';save();render();scrollUp()}else if(a==='finish'){view='final';render();scrollUp()}else if(a==='review'){view='review';render();scrollUp()}else if(a==='reviewStage'){view='review';render();scrollUp()}else if(a==='bookmark'){const k=qa(st.stage,st.i);st.bookmarks[k]=!st.bookmarks[k];save();render();toast(st.bookmarks[k]?'★ 復習リストに保存':'保存を解除')}else if(a==='hint'){if(st.hints<=0)return;st.hints--;const q=qData();const key=qa(st.stage,st.i);const ord=order(st.stage,st.i);const first=ord.find(o=>o!==q[2]);st.hidden[key]=[first];save();render();toast('💡 不正解の選択肢を1つ消しました')}else if(a==='fifty'){if(st.fifty<=0)return;st.fifty--;const q=qData(),key=qa(st.stage,st.i),hidden=st.hidden[key]||[];const wrong=order(st.stage,st.i).filter(o=>o!==q[2]&&!hidden.includes(o));st.hidden[key]=[...hidden,...wrong.slice(0,2)];save();render();toast('◐ 選択肢を2つ消しました')}else if(a==='calc'){openCalc()}else if(a==='certificate'){certificate()}else if(a==='filter'){const items=[];ST.forEach((g,s)=>g.questions.forEach((q,i)=>{const k=qa(s,i);if(st.a[k]===undefined)return;const wrong=st.a[k]!==q[2],bookmarked=!!st.bookmarks[k];if(d.filter==='wrong'&&!wrong)return;if(d.filter==='star'&&!bookmarked)return;items.push({s,i,q,wrong,bookmarked})}));$('reviewItems').innerHTML=reviewItems(items)}else if(a==='resetAsk'){modal(`<h2>進捗をリセットしますか？</h2><p>全100問の回答、XP、最高コンボ、ステージ解放を削除します。元には戻せません。</p><div class="modal-actions"><button class="btn secondary" data-modal="close">キャンセル</button><button class="btn secondary danger" data-modal="reset">すべて消去</button></div>`)} }
function firstUnanswered(s){let i=ST[s].questions.findIndex((q,j)=>!st.revealed[qa(s,j)]);return i===-1?9:i}function scrollUp(){window.scrollTo({top:0,behavior:'instant'})}
function modal(html){$('modalRoot').innerHTML=`<div class="modal-wrap" id="overlay"><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`;$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});$('modalRoot').querySelectorAll('[data-modal]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.modal==='reset'){st=fresh();save();view='home';closeModal();render()}else closeModal()}));}function closeModal(){$('modalRoot').innerHTML=''}
function openCalc(){let expr='',display='0';const html=`<div class="row"><h2>🧮 エンジニア電卓</h2><button class="icon-btn" id="calcClose" aria-label="閉じる">×</button></div><p>計算問題で使えます。括弧・小数・四則演算・平方根に対応。答えは選択肢から選んでください。</p><div class="calc-display" id="calcDisplay" aria-live="polite">0</div><div class="calc-grid">${['AC','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','√','0','.','='].map(c=>`<button data-key="${c}" class="${'÷×−+√'.includes(c)?'op':''} ${c==='='?'equal':''} ${c==='AC'?'clear':''}">${c}</button>`).join('')}</div><div class="modal-actions"><button class="btn secondary" id="calcBack">⌫ 一文字削除</button><button class="btn primary" id="calcCopy">結果をコピー</button></div>`;modal(html);$('calcClose').onclick=closeModal;$('calcBack').onclick=()=>{expr=expr.slice(0,-1);update()};$('calcCopy').onclick=()=>{const val=$('calcDisplay').textContent;try{navigator.clipboard.writeText(val);toast('計算結果をコピーしました')}catch(e){toast('結果：'+val)}};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const x=b.dataset.key;if(x==='AC')expr='';else if(x==='='){try{expr=String(calcEvaluate(expr))}catch(e){toast('計算式を確認してください')}}else expr+=x==='√'?'√(':x;update()});function update(){$('calcDisplay').textContent=expr||'0'}}
function calcEvaluate(source){const tokens=source.replace(/\s/g,'').replace(/[×÷−]/g,c=>({'×':'*','÷':'/','−':'-'}[c])).match(/\d*\.?\d+(?:[eE][+-]?\d+)?|√|[()+*/-]/g);if(!tokens||tokens.join('')!==source.replace(/\s/g,'').replace(/[×÷−]/g,c=>({'×':'*','÷':'/','−':'-'}[c])))throw Error('invalid');let i=0;const atom=()=>{const t=tokens[i++];if(t==='-')return -atom();if(t==='+')return atom();if(t==='√'){if(tokens[i++]!=='(')throw Error();const v=add();if(tokens[i++]!==')'||v<0)throw Error();return Math.sqrt(v)}if(t==='('){const v=add();if(tokens[i++]!==')')throw Error();return v}const v=Number(t);if(!Number.isFinite(v))throw Error();return v};const mul=()=>{let v=atom();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],r=atom();v=op==='*'?v*r:v/r}return v};const add=()=>{let v=mul();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],r=mul();v=op==='+'?v+r:v-r}return v};const res=add();if(i!==tokens.length||!Number.isFinite(res))throw Error();return Number(res.toPrecision(12))}
